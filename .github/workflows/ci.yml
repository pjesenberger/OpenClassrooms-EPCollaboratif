name: iOS Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 16 Pro'
          action: test
          result-bundle-path: './TestResults/TestResults.xcresult'
          allow-provisioning-updates: true
          build-settings: 'CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO'

      - name: Debug - Check for .xcresult file
        run: |
          echo "Listing contents of TestResults directory after build:"
          ls -R TestResults || echo "TestResults directory or TestResults.xcresult not found"
        if: always()

      - name: Process Test Results (Generate Reports)
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ./TestResults/TestResults.xcresult
          upload-bundles: 'never'
        if: always()

      - name: Debug - Check for generated report directory
        run: |
          echo "Listing contents of TestResults directory after xcresulttool processing:"
          ls -R TestResults || echo "TestResults directory not found after processing"
          echo "Expected report path: TestResults/report"
          ls -R TestResults/report || echo "TestResults/report directory not found"
        if: always()

      - name: Upload Test Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: ./TestResults/report
        if: always()